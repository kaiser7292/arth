<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg-grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Dark gradient background -->
  <rect width="1024" height="1024" rx="200" ry="200" fill="url(#bg-grad4)"/>
  <!-- Geometric A shape — stylized with Devanagari-inspired horizontal bar -->
  <g filter="url(#shadow4)">
    <!-- Left leg of A -->
    <polygon points="340,780 420,780 540,280 460,280" fill="white"/>
    <!-- Right leg of A -->
    <polygon points="604,780 684,780 564,280 484,280" fill="white"/>
    <!-- Crossbar — Devanagari-style horizontal line (shirorekha) extending wider -->
    <rect x="280" y="260" width="464" height="50" rx="8" fill="white"/>
    <!-- Middle crossbar -->
    <rect x="380" y="520" width="264" height="40" rx="6" fill="white"/>
  </g>
</svg>
