apply plugin: 'com.android.library'

group = 'expo.modules.arthappupdates'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.arthappupdates"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Play's in-app updates: asks the Play Store app on the phone, no server of ours involved.
  implementation 'com.google.android.play:app-update:2.1.0'
}
