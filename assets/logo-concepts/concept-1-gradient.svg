<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- Rounded background with gradient -->
  <rect width="1024" height="1024" rx="200" ry="200" fill="url(#bg-grad)"/>
  <!-- Devanagari अ -->
  <text x="512" y="580" text-anchor="middle" dominant-baseline="central"
        font-family="Noto Sans Devanagari, Devanagari MT, Kohinoor Devanagari, sans-serif"
        font-size="560" font-weight="bold" fill="white">अ</text>
</svg>
